<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="-1" />
    
    <title>
    Curve
    </title>
    
    <!-- <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js" type="text/javascript"></script> -->
    <script src="js/jquery-1.7.1.min.js" type="text/javascript"></script>
    <script src="js/jquery.ba-throttle-debounce.min.js" type="text/javascript"></script>

<style type="text/css">
body
{
    font-family: myriad, verdana, sans-serif;
}

/* http://stackoverflow.com/questions/7059039/how-to-prevent-accidental-select-drag-highlight-on-webpage-when-drawing-off-html */
.canvasholder
{
  -moz-user-select: none;
  -khtml-user-select: none;
  -webkit-user-select: none;
  user-select: none;
}
canvas
{
    border: 1px solid #000;
}

#nacl_holder embed
{
    float: left;
}
</style>

</head>
<body>

<div id="canvasholder">
<form action="">
<input type="button" id="clear" name="clear" value="Clear">
<label for="add"><input type="radio" name="mouse_mode" value="add" id="add" checked="checked">Add Point</label>
<label for="move"><input type="radio" name="mouse_mode" value="move" id="move">Move Point</label>
<select name="style" id="style">
<option value="BERNSTEIN" selected="selected">BERNSTEIN</option>
<option value="CASTELJAU">CASTELJAU</option>
<option value="MATRIX">MATRIX</option>
<option value="BSPLINE">BSPLINE</option>
<option value="HERMITE">HERMITE</option>
</select>
<label for="show_control_points"><input type="checkbox" name="show_control_points" value="show_control_points" id="show_control_points">Show Control Points</label>
</form>

<canvas id="curve_canvas" width="500" height="500"></canvas>
<p id="tooltip"></p>
</div>

<div id="nacl_holder">
<div id="nacl_status">
    <p>Loading...</p>
</div>
</div>

<script type='text/javascript'>
"use strict";

$(document).ready( function() {
    ///
    /// Global variables.
    ///
    var nacl_module = null;
    var myCurveData = null;
    var canvas = null;
    var ctx = null;
    
    
    ///
    /// Global functions.
    ///
    function handleMessage( msg )
    {
        // alert( msg.data );
        
        var token = msg.data.split(' ',1);
        if( 'alert' == token )
        {
            alert( msg.data.slice( 'alert'.length + 1 ) );
        }
        else if( 'log' == token )
        {
            console.log( msg.data.slice( 'log'.length + 1 ) );
        }
        else if( 'GetData' == token )
        {
            myCurveData = $.parseJSON( msg.data.slice( 'GetData'.length + 1 ) );
            // console.log( myCurveData );
            draw();
        }
    }
    
    var kPointRadius = 5.;
    function DrawCircle( pt )
    {
        ctx.moveTo( pt[0], pt[1] );
        ctx.arc( pt[0], pt[1], kPointRadius, 0, 2*Math.PI, false );
    }
    function AddPoints( pt0, pt1 )
    {
        return [ pt0[0] + pt1[0], pt0[1] + pt1[1] ];
    }
    function draw()
    {
        if( canvas === null || ctx === null ) return;
        
        ctx.clearRect( 0, 0, canvas.width, canvas.height );
        
        if( myCurveData == null ) return;
        
        // A solid black background:
        // UPDATE: Let's leave it translucent.
        ctx.fillStyle = "rgb( 0,0,0 )";
        ctx.fillRect( 0, 0, canvas.width, canvas.height );
        
        {
            var endPoints = myCurveData.endPoints;
            var interpPoints = myCurveData.interpPoints;
            var ctrlPoints = myCurveData.ctrlPoints;
            var curve = myCurveData.curve;
            
            if( interpPoints.length == 0 ) return;
            else if( interpPoints.length == 1 )
            {
                ctx.fillStyle = "rgb( 0,0,255 )";
                
                ctx.beginPath();
                DrawCircle( interpPoints[0] );
                ctx.fill();
                
                return;
            }
            else
            {
                // If there is more than 1 point, draw the curve.
                var style = $("#style option:selected").val();
                var showCtrl = $("#show_control_points").is(':checked');
                
                if (style != 'BSPLINE' && style != 'HERMITE'){
                    ctx.fillStyle = 'rgb(0,255,0)';
                    
                    // Draw the two end points.
                    ctx.beginPath();
                    DrawCircle(endPoints[0]);
                    DrawCircle(endPoints[1]);
                    ctx.fill();
                    
                    
                    // Connect end points with interpolation points with straight lines.
                    ctx.strokeStyle = 'rgb(0,255,0)';
                    ctx.lineWidth = 2;
                    
                    ctx.beginPath();
                    
                    ctx.moveTo(endPoints[0][0], endPoints[0][1]);
                    ctx.lineTo(interpPoints[0][0], interpPoints[0][1]);
                    
                    ctx.moveTo(interpPoints[interpPoints.length - 1][0], interpPoints[interpPoints.length - 1][1]);
                    ctx.lineTo(endPoints[1][0], endPoints[1][1]);
                    
                    ctx.stroke();
                }
                
                // Draw the curve.
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgb(255,0,0)';
                ctx.beginPath();
                for( var i = 0; i < curve.length - 1; i++ ){
                    ctx.moveTo(curve[i][0], curve[i][1]);
                    ctx.lineTo(curve[i + 1][0], curve[i + 1][1]);
                }
                ctx.stroke();
                
                // Draw interpolation points.
                ctx.lineWidth = 2;
                ctx.fillStyle = 'rgb(0,0,255)';
                ctx.beginPath();
                for( var i = 0; i < interpPoints.length; i++ ){
                    DrawCircle(interpPoints[i]);
                }
                ctx.fill();
                
                // Draw control points and lines that connect them
                if (showCtrl && ctrlPoints.length > 0){
                    ctx.fillStyle = 'rgb(255,255,0)';
                    ctx.strokeStyle = 'rgb(255,255,0)';
                    //B-spline, draw its control points
                    if (style == 'BSPLINE'){
                        ctx.beginPath();
                        for (var i = 0; i < interpPoints.length + 1; i++){
                            ctx.moveTo(ctrlPoints[i][0], ctrlPoints[i][1]);
                            ctx.lineTo(ctrlPoints[i + 1][0], ctrlPoints[i + 1][1]);
                        }
                        ctx.stroke();
                        ctx.beginPath();
                        for (var i = 0; i < interpPoints.length + 1; i++){
                            DrawCircle(ctrlPoints[i]);
                        }
                        DrawCircle(ctrlPoints[interpPoints.length + 1]);
                        ctx.fill();
                    }
                    else if (style == 'HERMITE'){
                        ctx.beginPath();
                        for (var i = 0; i < interpPoints.length; i++)
                        {
                            ctx.moveTo(interpPoints[i][0], interpPoints[i][1]);
                            ctx.lineTo(interpPoints[i][0] + ctrlPoints[i][0], interpPoints[i][1] + ctrlPoints[i][1]);
                        }
                        ctx.stroke();
                        ctx.beginPath();
                        for (var i = 0; i < interpPoints.length; i++)
                        {
                            DrawCircle(AddPoints(interpPoints[i], ctrlPoints[i]));
                        }
                        ctx.fill();
                    }else{
                        //Bezier curve, draw its control points
                        ctx.beginPath();
                        for (var i = 0; i < interpPoints.length - 1; i++){
                            ctx.moveTo(interpPoints[i][0], interpPoints[i][1]);
                            ctx.lineTo(ctrlPoints[i * 2][0], ctrlPoints[i * 2][1]);
                            
                            ctx.moveTo(ctrlPoints[i * 2][0], ctrlPoints[i * 2][1]);
                            ctx.lineTo(ctrlPoints[i * 2 + 1][0], ctrlPoints[i * 2 + 1][1]);
                            
                            ctx.moveTo(ctrlPoints[i * 2 + 1][0], ctrlPoints[i * 2 + 1][1]);
                            ctx.lineTo(interpPoints[i + 1][0], interpPoints[i + 1][1]);
                        }
                        ctx.stroke();
                        ctx.beginPath();
                        for (var i = 0; i < interpPoints.length - 1; i++){
                            DrawCircle(ctrlPoints[i * 2]);
                            DrawCircle(ctrlPoints[i * 2 + 1]);
                        }
                        ctx.fill();
                    }
                }
            }
        }
    }
    // Create the need_redisplay function.
    // var need_redisplay = $.throttle( 16, draw );
    // var GetDataThrottled = $.throttle( 16, function() { nacl_module.postMessage( "GetData" ); } );
    var need_redisplay = $.throttle( 16, function() { nacl_module.postMessage( "GetData" ); } );
    
    function event_xy_in_container( evt, container )
    {
        // The advice to use offsetLeft/Top:
        //     http://docs.jquery.com/Tutorials:Mouse_Position
        // is wrong.
        // Instead, using jQuery's offset() gives the desired result:
        var x = evt.pageX - $(container).offset().left;
        var y = evt.pageY - $(container).offset().top;
        
        return [ x, y ];
    }
    var move_handlers = function() {
        var result = {};
        
        result.mousedown = function( evt )
            {
                var xy = event_xy_in_container( evt, this );
                nacl_module.postMessage( "PickPoint " + xy[0] + " " + xy[1] );
                need_redisplay();
                
                // Set up the move event handler:
                $(this).mousemove( result.mousemove );
                // Stop moving on mouseup (which must be on the window, not the element).
                $(window).mouseup( result.mouseup );
                
                // NOTE: If we wanted to forward the event
                //       to result.mousemove(), we would do it
                //       using call() with the correct 'this' parameter.
                // result.mousemove.call( this, evt );
            };
        
        result.mousemove = function( evt )
            {
                var xy = event_xy_in_container( evt, this );
                nacl_module.postMessage( "MovePicked " + xy[0] + " " + xy[1] );
                need_redisplay();
            };
        
        result.mouseup = function( evt )
            {
                // Stop moving on mouseup.
                // NOTE: this is the window here, not #curve_canvas.
                $('#curve_canvas').off( 'mousemove' );
                $(window).off( 'mouseup' );
            };
        
        return result;
        }();
    
    var add_handlers = function() {
        var result = {};
        
        result.mousedown = function( evt )
            {
                var xy = event_xy_in_container( evt, this );
                nacl_module.postMessage( "AddPoint " + xy[0] + " " + xy[1] );
                need_redisplay();
            };
        
        return result;
        }();
    
    function set_mouse_mode( mode )
    {
        // Disable the current event listeners.
        $('#curve_canvas').off( 'mousedown' );
        $('#curve_canvas').off( 'mousemove' );
        $( window ).off( 'mouseup' );
        
        // Enable the correct mouse-down event listener.
        if( 'move' == mode )
        {
            $("#curve_canvas").mousedown( move_handlers.mousedown );
        }
        else if( 'add' == mode )
        {
            $("#curve_canvas").mousedown( add_handlers.mousedown );
        }
        else
        {
            alert( "Unknown mouse mode: " + mode );
        }
    }
    
    
    ///
    /// Initialization code.
    ///
    // Load the native client module.
    {
        var nacl_holder = $("#nacl_holder");
        nacl_holder.get(0).addEventListener( 'load', moduleDidLoad, true );
        // This doesn't work for some reason:
        // nacl_holder.load( function() { alert( "module loaded!" ); } );
        // So I don't trust it for "message", either:
        // nacl_holder.on( "message", function() { alert( "message!" ); } );
        nacl_holder.get(0).addEventListener( 'message', handleMessage, true );
        nacl_holder.append( '<embed name="nacl_module" id="nacl_module" width=40 height=40 src="Curve.nmf" type="application/x-nacl" />' );
        
        canvas = $("#curve_canvas").get(0);
        ctx = $("#curve_canvas").get(0).getContext("2d");
        
        // The rest of the setup code, setup_callbacks() will be called by
        // moduleDidLoad.
    }
    function moduleDidLoad()
    {
        // alert( "module loaded!" );
        $("#nacl_status").html( '<p>Loaded.</p>' );
        
        // THIS CAUSES THE EMBED TO STOP WORKING:
        // $("#nacl_holder embed").hide();
        
        nacl_module = $("#nacl_module").get(0);
        
        setup_callbacks();
    }
    function setup_callbacks()
    {
        $("#style").change( function() {
            var style = $("#style option:selected").val();
            nacl_module.postMessage( "SetInterpolationStyle " + style );
            nacl_module.postMessage( "GetData" );
            } );
        // Call the style-changed function to set the module's style to
        // what it is here in the HTML.
        $("#style").change();
        
        $("#show_control_points").change( function() {
            var show_control_points = $("#show_control_points").is(':checked');
            nacl_module.postMessage( "SetShowControlPoints " + ( show_control_points ? "true" : "false" ) );
            nacl_module.postMessage( "GetData" );
            } );
        // Call the changed function to set the module's value to
        // what it is here in the HTML.
        $("#show_control_points").change();
        
        $("#clear").click( function() {
            nacl_module.postMessage( "ClearAll" );
            nacl_module.postMessage( "GetData" );
            } );
        
        $("input[name=mouse_mode]").change( function() {
            set_mouse_mode( $("input[name=mouse_mode]:checked").val() );
            } );
        set_mouse_mode( $("input[name=mouse_mode]:checked").val() );
    }
} );
</script>

</body>
</html>
