<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="-1" />
    
    <title>
    Curve
    </title>
    
    <!-- <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js" type="text/javascript"></script> -->
    <script src="js/jquery-1.7.1.min.js" type="text/javascript"></script>
    <script src="js/jquery.ba-throttle-debounce.min.js" type="text/javascript"></script>

<style type="text/css">
body
{
    font-family: myriad, verdana, sans-serif;
}

/* http://stackoverflow.com/questions/7059039/how-to-prevent-accidental-select-drag-highlight-on-webpage-when-drawing-off-html */
.canvasholder
{
  -moz-user-select: none;
  -khtml-user-select: none;
  -webkit-user-select: none;
  user-select: none;
}
canvas
{
    border: 1px solid #000;
}

#nacl_holder embed
{
    float: left;
}
</style>

</head>
<body>

<div id="canvasholder">
<form action="">
<input type="button" id="clear" name="clear" value="Clear">
<label for="add"><input type="radio" name="mode" value="add" id="add" checked>Add Point</label>
<label for="move"><input type="radio" name="mode" value="add" id="move" checked>Move Point</label>
<select name="style" id="style">
<option value="BERNSTEIN" selected="selected">BERNSTEIN</option>
<option value="CASTELJAU">CASTELJAU</option>
<option value="MATRIX">MATRIX</option>
<option value="BSPLINE">BSPLINE</option>
<option value="HERMITE">HERMITE</option>
</select>
</form>

<canvas id="surface" width="500" height="500"></canvas>
<p id="tooltip"></p>
</div>

<div id="nacl_holder">
<div id="nacl_status">
    <p>Loading...</p>
</div>
</div>

<script type='text/javascript'>
"use strict";

$(document).ready( function() {
    var nacl_module = null;
    
    function moduleDidLoad()
    {
        // alert( "module loaded!" );
        $("#nacl_status").html( '<p>Loaded.</p>' );
        
        // THIS CAUSES THE EMBED TO STOP WORKING:
        // $("#nacl_holder embed").hide();
        
        nacl_module = $("#nacl_module").get(0);
    }
    
    function handleMessage( msg )
    {
        // alert( msg.data );
        
        var token = msg.data.split(' ',1);
        if( 'alert' == token )
        {
            alert( msg.data.slice( 'alert'.length + 1 ) );
        }
        else if( 'log' == token )
        {
            console.log( msg.data.slice( 'log'.length + 1 ) );
        }
        else if( 'GetData' == token )
        {
            console.log( $.parseJSON( msg.data.slice( 'GetData'.length + 1 ) ) );
        }
    }
    
    var nacl_holder = $("#nacl_holder");
    nacl_holder.get(0).addEventListener( 'load', moduleDidLoad, true );
    // This doesn't work for some reason:
    // nacl_holder.load( function() { alert( "module loaded!" ); } );
    // So I don't trust it for "message", either:
    // nacl_holder.on( "message", function() { alert( "message!" ); } );
    nacl_holder.get(0).addEventListener( 'message', handleMessage, true );
    nacl_holder.append( '<embed name="nacl_module" id="nacl_module" width=40 height=40 src="Curve.nmf" type="application/x-nacl" />' );
    
    $("#style").change( function() {
        var style = $("#style option:selected").val();
        nacl_module.postMessage( "SetInterpolationStyle " + style );
        } );
} );
</script>

</body>
</html>
